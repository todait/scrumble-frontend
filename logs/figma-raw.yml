                                      characters: >-
                                        푸른 산 한나절 구름은 가고 고을 너머 뻐꾸기는 우는데 눈에 어려
                                        흘러가는 물결 같은 사람 속 아우성쳐 흘러가는 물결 같은 사람 속에 난
                                        그리노라. 청산도 산아 우뚝 솟은 푸른 산아.

                                        숱한 나무들 무성히 무성히 우거진 산마루에 금빛 기름진 햇살은 내려오고,
